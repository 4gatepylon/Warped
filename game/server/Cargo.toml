# `Cargo.toml` builds warped-server, the game server, binary `warped-server` (REFACTOR_PLAN.md,
# section 5).
#
# Example:
#     cargo run --release -p warped-server -- --port 47800 --map lunar-surface --game-password-file <file>
#
# Must know:
#     - Limitations: warped-server must build on Linux, so it depends only on warped-core and
#       portable crates.
[package]
name = "warped-server"
version.workspace = true
edition.workspace = true

[dependencies]
warped-core.workspace = true
clap.workspace = true
glam.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
legacy-oracle = { path = "../legacy_oracle" }
