# `Cargo.toml` builds warped-core, the library the game window and the game server share
# (REFACTOR_PLAN.md, section 5).
#
# Example:
#     cargo test -p warped-core
#
# Must know:
#     - Limitations: warped-core must build on Linux, so it never depends on sdl3, objc2 or Metal.
[package]
name = "warped-core"
version.workspace = true
edition.workspace = true

[dependencies]
clap.workspace = true
getrandom.workspace = true
glam.workspace = true
gltf.workspace = true
hmac.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
legacy-oracle = { path = "../legacy_oracle" }
