# `pyproject.toml` defines the game server's uv project: its package, dependencies and tools.
#
# Interface:
#     game_server package: src/game_server/.
#     game-server command: runs one game server (src/game_server/serve.py).
#     dev dependency group: httpx2 (for FastAPI's test client), pytest and ruff.
#
# Example:
#     uv run game-server --help
[project]
name = "game-server"
version = "0.1.0"
description = "Runs one Warped room in real time"
requires-python = ">=3.13"
dependencies = [
    "click>=8.1",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "uvicorn>=0.30",
    "websockets>=13",
]

[project.scripts]
game-server = "game_server.serve:main"

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"
