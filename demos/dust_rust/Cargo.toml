# `Cargo.toml` builds the Rust port of the hyperbolic wormholes demo (`../hyperbolic_wormholes/`).
#
# Interface:
#     dust_level: the level as a library (src/lib.rs, macOS only: Metal and SDL), whose
#         play_level the one-window app (../warped_mvp_rust/) calls.
#     hyperbolic-wormholes: the game alone (src/main.rs, which runs the library), what `cargo run` runs
#         (the package is named dust, so the one-window app can depend on it beside Lunar Surface).
#     wormholes_server: a game server alone (src/bin/wormholes_server.rs), which also builds for Linux.
#
# Example:
#     cargo run --release
[package]
name = "dust"
version = "0.1.0"
edition = "2024"
default-run = "hyperbolic-wormholes"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
glam = "0.34"
gltf = { version = "1.4", features = ["KHR_materials_emissive_strength", "KHR_materials_transmission"] }
hmac = "0.13.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
png = "0.18"
rayon = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
serde_yaml = "0.9"
sha2 = "0.11.1"
warped_shared = { path = "../warped_shared_rust" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
objc2-metal = "0.3"
objc2-metal-fx = "0.3"
objc2-quartz-core = "0.3"
sdl3 = { version = "0.22", features = ["build-from-source-static"] }

[lib]
name = "dust_level"

[[bin]]
name = "hyperbolic-wormholes"
path = "src/main.rs"

[[bin]]
name = "wormholes_server"
test = false

[[test]]
name = "in_one_window"
harness = false
