# `Cargo.toml` builds Warped's one-window app (`warped`): the main menu, the game menu and, once
# the levels are libraries, each level in the same window. The match server, the level servers and
# the bots stay their own headless programs, which the app starts as child processes.
#
# Interface:
#     warped: the app (macOS only: SDL3 and Metal), what `cargo run` runs.
#
# Example:
#     cargo run --release
[package]
name = "warped-mvp"
version = "0.1.0"
edition = "2024"
default-run = "warped"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
warped_shared = { path = "../warped_shared_rust" }

[target.'cfg(target_os = "macos")'.dependencies]
city_sphere_level = { package = "city-sphere", path = "../city_sphere_rust" }
dark_forest_level = { package = "warped-dark-forest", path = "../dark_forest_rust" }
dust_level = { package = "dust", path = "../dust_rust" }
lunar_surface_level = { package = "hyperbolic-wormholes", path = "../hyperbolic_wormholes_rust" }
snow_planet_level = { package = "snow-planet", path = "../snow_planet_rust" }
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-metal = "0.3"
objc2-quartz-core = "0.3"
sdl3 = { version = "0.22", features = ["build-from-source-static"] }

[[bin]]
name = "warped"
path = "src/main.rs"
