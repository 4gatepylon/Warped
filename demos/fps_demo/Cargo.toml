[package]
name = "warped-fps-demo"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
sdl3 = { version = "0.22", features = ["build-from-source-static"] }
glam = "0.30"
half = "2"
gltf = { version = "1.4", features = ["KHR_materials_emissive_strength", "KHR_materials_transmission", "KHR_texture_transform"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "hdr"] }
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-foundation = "0.3"
objc2-metal = "0.3"
objc2-quartz-core = "0.3"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
serde_json = "1"

[[bin]]
name = "warped-fps-demo"
path = "src/main.rs"

[[bin]]
name = "download-assets"
path = "src/bin/download_assets.rs"
