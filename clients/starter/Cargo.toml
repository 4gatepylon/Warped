[package]
name = "warped-starter-client"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
sdl3 = { version = "0.22", features = ["build-from-source-static"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tungstenite = "0.30.0"
ureq = { version = "2", default-features = false, features = ["json"] }
