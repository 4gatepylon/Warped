# `pyproject.toml` defines the management server's uv project: its package, dependencies and tools.
#
# Interface:
#     management_server package: src/management_server/.
#     dev dependency group: httpx2 (for FastAPI's test client), pytest and ruff.
#
# Example:
#     uv run pytest
[project]
name = "management-server"
version = "0.1.0"
description = "Starts and stops Warped game servers and tracks who may join them"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["uv_build>=0.8"]
build-backend = "uv_build"
